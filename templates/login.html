{% extends 'base.html' %}
{% block content %}
<h3>Login</h3>
<form method="POST">
    <input name="username" placeholder="Username" required>
    <input name="password" type="password" placeholder="Password" required>
    <button>Login</button>
</form>
<p>No account? <a href="/signup">Signup</a></p>
{% endblock %}
